[package]
name = "facedetector"
version = "0.1.0"
edition = "2024"
authors = ["Javad Mokhtari javad.mktri@gmail.com>"]
description = "High-level Face Detection via YOLO Algorithm (v11s) & ONNX Runtime"
license = "MIT"
repository = "https://github.com/JavadMokhtari/RustYOLOFaceDetection"

[lib]
crate-type = ["cdylib"]

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["cuda"] }
image = "0.25.10"
ndarray = "0.17.2"
num_cpus = "1.17.0"
